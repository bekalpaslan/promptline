[package]
name = "promptline"
version = "0.2.21"
description = "Your prompt vocabulary, one hotkey away, in every window"
edition = "2021"
license = "MIT"

[lib]
name = "promptline_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
rfd = "0.15"
tauri-plugin-single-instance = "2"
tauri-plugin-log = "2"
log = "0.4"
tauri-plugin-updater = { version = "2", optional = true }

[target."cfg(windows)".dependencies]
tauri-winrt-notification = { version = "0.8", optional = true }
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
] }

[features]
# The GitHub build: checks promptline.cc for a newer release and installs
# it. A store build leaves it out (`--no-default-features`): the store
# updates that copy, and it makes no network request at all.
default = ["updater"]
updater = ["dep:tauri-plugin-updater", "dep:tauri-winrt-notification"]
