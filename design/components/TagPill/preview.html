<!-- @dsCard group="Popup" height=80 subtitle="The eight tag hues, one pill filled as an active filter" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="root"></div>
<script>
  Promptline.syncTheme()
  const { h, mount, TagPill } = Promptline
  const tags = ["debug", "review", "plan", "refactor", "test", "guardrails", "meta", "general"]
  mount(document.getElementById("root"),
    h("div", { className: "flex flex-col gap-2 p-3" },
      h("div", { className: "flex flex-wrap items-center gap-1" }, ...tags.map((t) => h(TagPill, { key: t, tag: t }))),
      h("div", { className: "flex flex-wrap items-center gap-1" }, ...tags.map((t) => h(TagPill, { key: t, tag: t, active: t === "test" })))))
</script>
</body>
</html>
