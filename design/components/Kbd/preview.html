<!-- @dsCard group="Popup" height=96 subtitle="The popup's 16px key, and a hint bar as the popup draws it" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<div id="root"></div>
<script>
  Promptline.syncTheme()
  const { h, mount, Kbd } = Promptline
  const hint = (k, label) => h("span", { className: "flex shrink-0 items-center gap-1" }, h(Kbd, null, k), label)
  mount(document.getElementById("root"),
    h("div", { className: "flex flex-col gap-3 p-3" },
      h("div", { className: "flex items-center gap-1" }, h(Kbd, null, "Ctrl"), h(Kbd, null, "1"), h("span", { className: "w-3" }), h(Kbd, null, "Tab"), h("span", { className: "w-3" }), h(Kbd, null, "Esc"), h("span", { className: "w-3" }), h(Kbd, null, "last used")),
      h("div", { className: "flex items-center gap-1.5 border-t border-border px-1 pt-2 font-mono text-[11px] text-muted-foreground" },
        hint("↵", "paste"), hint("Ctrl ↵", "copy"), hint("Tab", "actions"), hint("→", "preview"), hint("Esc", "close"))))
</script>
</body>
</html>
