name: CI

# Every pushed branch, not just master: feature branches are merged locally,
# so a master-only trigger only ever ran after the merge had landed. Tags
# are listed so a `v*` tag also runs the installer job below.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Windows: the Rust crate depends on the win32 bindings and the test
    # suite exercises the Windows-specific pack filename rules.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # The Vite build is where Tailwind and CSS errors surface; without it
      # they used to wait for the release build
      - run: npm run ui:build
      - run: npm test
      # The UI suite: both windows in Chromium against the fake backend
      # (e2e/, playwright.config.ts starts its own Vite). The browser is
      # the one pinned by @playwright/test, so it follows package-lock
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run test:rust

  installers:
    # On a `v*` tag only: the same `tauri build` the release runs locally,
    # kept as workflow artefacts so a clean machine is known to produce
    # both installers. Signing and the GitHub release itself stay manual.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
