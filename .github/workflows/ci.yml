name: CI

# Every pushed branch, not just master: feature branches are merged locally,
# so a master-only trigger only ever ran after the merge had landed
on:
  push:
  pull_request:

jobs:
  checks:
    # Windows: the Rust crate depends on the win32 bindings and the test
    # suite exercises the Windows-specific pack filename rules.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:rust
