name: Site

# Publishes site/ to GitHub Pages at https://promptline.cc. The popup
# screenshot lives in docs/ (the README uses it too) and is copied in at
# publish time rather than kept twice in the repo.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/popup.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp docs/popup.png site/popup.png
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
