name: Site

# Publishes site/ to GitHub Pages at https://promptline.cc. The screenshots
# live in docs/ (the README uses them too; `npm run shots` makes them) and
# are copied in at publish time rather than kept twice in the repo:
# docs/og.png for the social card, docs/screenshots/ for the page.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/og.png"
      - "docs/screenshots/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          cp docs/og.png site/og.png
          mkdir -p site/shots
          cp docs/screenshots/*.png site/shots/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
