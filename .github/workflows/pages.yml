name: Site

# Publishes site/ to GitHub Pages at https://promptline.cc. The screenshots
# live in docs/ (the README uses them too; `npm run shots` makes them) and
# are copied in at publish time rather than kept twice in the repo:
# docs/og.png for the social card, docs/screenshots/ for the page, and
# docs/clip/ (npm run clip) for the hero's video.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/og.png"
      - "src-tauri/icons/**"
      - "docs/screenshots/**"
      - "docs/clip/**"
      - "scripts/site-assets.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The copies, and the WebP the page serves, come from one script so a
      # local preview gets the same files. Ubuntu's mirror stalls on some
      # runners: ffmpeg's 69 MB took 6 s on one and outlasted the job's ten
      # minutes on another (0.2.28 and 0.2.29, each leaving the old feed
      # live). So a push that changes no image, which every feed update is,
      # takes the WebP from the cache and installs nothing, and a miss (new
      # images, or seven days unused) installs cwebp, whose package is about
      # 100 KB on this image, since its libraries are already there.
      - id: webp
        uses: actions/cache@v6
        with:
          path: |
            site/shots/*.webp
            site/clip/*.webp
          key: site-webp-${{ hashFiles('docs/screenshots/*.png', 'docs/clip/*-poster.png', 'scripts/site-assets.mjs') }}
      # A stalled download gets a fresh start; the install itself is never
      # cut off halfway
      - if: steps.webp.outputs.cache-hit != 'true'
        run: |
          command -v cwebp && exit 0
          sudo apt-get update
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get install -y --download-only webp && break
            [ "$attempt" = 3 ] && exit 1
          done
          sudo apt-get install -y webp
      - run: node scripts/site-assets.mjs --reuse-webp
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
