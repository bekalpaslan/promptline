# Version-update PRs only: one grouped PR per ecosystem per month, so the
# maintainer reviews three PRs at most. Security alerts are a repository
# setting (Settings → Code security), not something this file turns on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Majors are taken by hand (typescript 7 and windows 0.62 broke the build
    # on 2026-10-29); the grouped PR stays within declared ranges. The Tauri
    # crate and its npm packages move together, by hand (dependabot skill).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@tauri-apps/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      npm-all:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    # Majors are taken by hand (typescript 7 and windows 0.62 broke the build
    # on 2026-10-29); the grouped PR stays within declared ranges. The Tauri
    # crate and its npm packages move together, by hand (dependabot skill).
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "tauri-build"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      cargo-all:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions-all:
        patterns:
          - "*"
