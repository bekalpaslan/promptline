<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Promptline</title>
<style>
  :root {
    --bg-0: #15161a;
    --bg-1: #1b1d23;
    --bg-2: #23262e;
    --bg-3: #2b2f3a;
    --line: #2c2f38;
    --text-1: #e9eaf0;
    --text-2: #a2a6b3;
    --text-3: #6b7080;
    --accent: #6c8ef5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    color: var(--text-1);
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  #search {
    margin: 12px 12px 8px;
    padding: 10px 13px;
    font-size: 14px;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--text-1);
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  #search::placeholder { color: var(--text-3); }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 142, 245, .15);
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }
  .item {
    position: relative;
    padding: 8px 10px 8px 14px;
    border-radius: 7px;
    cursor: pointer;
    user-select: none;
    transition: background .08s;
  }
  .item::before {
    content: "";
    position: absolute;
    left: 4px;
    top: 9px;
    bottom: 9px;
    width: 3px;
    border-radius: 2px;
    background: var(--cat, transparent);
    opacity: 0;
    transition: opacity .1s;
  }
  .item.selected::before { opacity: 1; }
  .item .row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .item .title {
    font-size: 13.5px;
    font-weight: 600;
    letter-spacing: .1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .cat {
    font-size: 10.5px;
    font-weight: 600;
    padding: 1.5px 8px;
    border-radius: 9px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .item .preview {
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2.5px;
  }
  .item.selected { background: var(--bg-3); }
  .item.selected .preview { color: var(--text-2); }
  .item.picked { background: rgba(108, 142, 245, .35); }
  #empty {
    padding: 24px 20px;
    text-align: center;
    color: var(--text-3);
    font-size: 13px;
  }
  #hint {
    padding: 7px 14px;
    font-size: 11px;
    color: var(--text-3);
    border-top: 1px solid var(--line);
    background: var(--bg-1);
    border-radius: 0 0 10px 10px;
  }
  #hint b { color: var(--text-2); font-weight: 600; }
  #clipPreview {
    display: none;
    padding: 6px 14px;
    font-size: 11.5px;
    color: #9fb3d9;
    background: rgba(108, 142, 245, .08);
    border-top: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #clipPreview.visible { display: block; }
  #clipPreview .label { color: var(--text-3); }

  /* Fill-in form for {field} placeholders */
  #form {
    flex: 1;
    display: none;
    flex-direction: column;
    gap: 10px;
    padding: 14px;
    overflow-y: auto;
  }
  #form.visible { display: flex; }
  body.form-mode #search, body.form-mode #list { display: none; }
  #formTitle {
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-1);
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  #form label {
    font-size: 11.5px;
    font-weight: 600;
    text-transform: capitalize;
    color: var(--text-2);
    display: block;
    margin-bottom: 4px;
  }
  #form textarea {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: 7px;
    color: var(--text-1);
    padding: 8px 10px;
    font-size: 13.5px;
    font-family: inherit;
    outline: none;
    resize: none;
    min-height: 36px;
    transition: border-color .12s, box-shadow .12s;
  }
  #form textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108, 142, 245, .15);
  }
  #formPaste {
    padding: 9px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13.5px;
  }
  #formPaste:hover { background: #7d9bf7; }
  /* Hover card: full prompt text, fixed max size, scrollable */
  #hoverCard {
    display: none;
    position: fixed;
    z-index: 10;
    left: 24px;
    right: 24px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--bg-2);
    border: 1px solid #3a3f4c;
    border-radius: 8px;
    box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
    padding: 10px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-word;
  }
  #hoverCard.visible { display: block; }
  #hoverCard .tok {
    padding: 0 5px;
    border-radius: 5px;
    font-size: 11.5px;
    font-weight: 600;
  }
  #hoverCard .tok.builtin { background: rgba(127,198,201,.15); color: #7fc6c9; }
  #hoverCard .tok.field { background: rgba(232,180,95,.15); color: #e8b45f; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #363b48; }
</style>
</head>
<body>
  <input id="search" type="text" placeholder="Search prompts…" spellcheck="false" autocomplete="off" />
  <div id="list"></div>
  <div id="form">
    <div id="formTitle"></div>
    <div id="formFields"></div>
    <button id="formPaste">Paste</button>
  </div>
  <div id="hoverCard"></div>
  <div id="clipPreview"><span class="label">clipboard → </span><span id="clipText"></span></div>
  <div id="hint"><b>Enter</b> paste · <b>Ctrl</b> copy only · <b>Esc</b> close</div>

<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;

const searchEl = document.getElementById('search');
const listEl = document.getElementById('list');
const formEl = document.getElementById('form');
const formTitleEl = document.getElementById('formTitle');
const formFieldsEl = document.getElementById('formFields');
const formPasteEl = document.getElementById('formPaste');
const clipPreviewEl = document.getElementById('clipPreview');
const clipTextEl = document.getElementById('clipText');
const hoverCardEl = document.getElementById('hoverCard');

let clipboardNow = '';
let snippets = [];
let filtered = [];
let selected = 0;
let formSnippet = null;   // snippet awaiting field fill-in
let formPasteMode = true; // paste vs copy-only, captured when form opens

// Per-category accent colors; unknown categories get a stable hashed pick
const CAT_COLORS = {
  debug: '#e5726f', review: '#b07ce8', plan: '#5fb2e8', refactor: '#62c391',
  test: '#e8b45f', guardrails: '#e8a25f', meta: '#7fc6c9', general: '#9aa2b5',
};
function catColor(name) {
  const key = (name || '').toLowerCase();
  if (CAT_COLORS[key]) return CAT_COLORS[key];
  const palette = Object.values(CAT_COLORS);
  let h = 0;
  for (const c of key) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return palette[h % palette.length];
}

// {clipboard} expands in Rust; {date}/{time} expand here; anything else is a fill-in field
const RESERVED = new Set(['clipboard', 'date', 'time']);

function customFields(text) {
  const fields = [];
  for (const m of text.matchAll(/\{([a-z_]+)\}/g)) {
    if (!RESERVED.has(m[1]) && !fields.includes(m[1])) fields.push(m[1]);
  }
  return fields;
}

function expandBuiltins(text) {
  const now = new Date();
  return text
    .replaceAll('{date}', now.toLocaleDateString())
    .replaceAll('{time}', now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
}

// Subsequence fuzzy match; lower score = better. Returns null on no match.
function fuzzyScore(query, text) {
  const q = query.toLowerCase(), t = text.toLowerCase();
  if (!q) return 0;
  const idx = t.indexOf(q);
  if (idx >= 0) return idx; // contiguous match, rank by position
  let ti = 0, gaps = 0;
  for (const ch of q) {
    const found = t.indexOf(ch, ti);
    if (found < 0) return null;
    gaps += found - ti;
    ti = found + 1;
  }
  return 1000 + gaps; // subsequence match ranks below contiguous
}

function filter() {
  const q = searchEl.value.trim();
  if (!q) {
    // No query: pinned first, then most-used, then alphabetical
    filtered = [...snippets].sort((a, b) =>
      (b.pinned - a.pinned) || (b.uses - a.uses) || a.title.localeCompare(b.title));
  } else {
    filtered = snippets
      .map(s => {
        const st = fuzzyScore(q, s.title);
        const sc = fuzzyScore(q, (s.tags || []).join(' '));
        const sb = fuzzyScore(q, s.text);
        let score = null;
        if (st !== null) score = st;
        else if (sc !== null) score = 3000 + sc;
        else if (sb !== null) score = 5000 + sb;
        return score === null ? null : { s, score };
      })
      .filter(Boolean)
      .sort((a, b) => (a.score - b.score) || (b.s.uses - a.s.uses))
      .map(e => e.s);
  }
  selected = 0;
  render();
}

function render() {
  listEl.innerHTML = '';
  if (!filtered.length) {
    const d = document.createElement('div');
    d.id = 'empty';
    d.textContent = snippets.length ? 'No matches' : 'No prompts yet — open Promptline from the tray to add some';
    listEl.appendChild(d);
    updateClipPreview();
    return;
  }
  filtered.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'item' + (i === selected ? ' selected' : '');
    const tags = s.tags || [];
    const color = catColor(tags[0] || '');
    item.style.setProperty('--cat', color);
    const row = document.createElement('div');
    row.className = 'row';
    const title = document.createElement('div');
    title.className = 'title';
    title.textContent = (s.pinned ? '📌 ' : '') + s.title;
    row.appendChild(title);
    for (const t of tags.slice(0, 2)) {
      const pill = document.createElement('span');
      pill.className = 'cat';
      pill.textContent = t;
      const c = catColor(t);
      pill.style.color = c;
      pill.style.background = c + '22';
      row.appendChild(pill);
    }
    const preview = document.createElement('div');
    preview.className = 'preview';
    preview.textContent = s.text.replace(/\s+/g, ' ');
    item.append(row, preview);
    item.addEventListener('click', e => pick(s, !e.ctrlKey));
    item.addEventListener('mousemove', () => {
      if (selected !== i) { selected = i; render(); }
      scheduleHoverCard(s, item);
    });
    item.addEventListener('mouseleave', scheduleHoverHide);
    listEl.appendChild(item);
  });
  const sel = listEl.children[selected];
  if (sel) sel.scrollIntoView({ block: 'nearest' });
  updateClipPreview();
}

// Show what {clipboard} would insert whenever the selected prompt uses it
function updateClipPreview() {
  const s = filtered[selected];
  if (s && s.text.includes('{clipboard}')) {
    clipTextEl.textContent = clipboardNow.trim()
      ? clipboardNow.replace(/\s+/g, ' ').slice(0, 300)
      : '(clipboard is empty)';
    clipPreviewEl.classList.add('visible');
  } else {
    clipPreviewEl.classList.remove('visible');
  }
}

// --- Hover card: full prompt preview on hover, scrollable, fixed max size ---
let hoverShowTimer = null;
let hoverHideTimer = null;
let hoverCardFor = null;

function renderTokens(target, text) {
  target.innerHTML = '';
  const re = /\{([a-z_]+)\}/g;
  let last = 0, m;
  while ((m = re.exec(text)) !== null) {
    if (m.index > last) target.appendChild(document.createTextNode(text.slice(last, m.index)));
    const tok = document.createElement('span');
    const builtin = RESERVED.has(m[1]);
    tok.className = 'tok ' + (builtin ? 'builtin' : 'field');
    tok.textContent = builtin ? m[1] : `${m[1]} — fill-in`;
    target.appendChild(tok);
    last = re.lastIndex;
  }
  if (last < text.length) target.appendChild(document.createTextNode(text.slice(last)));
}

function scheduleHoverCard(snippet, itemEl) {
  clearTimeout(hoverHideTimer);
  if (hoverCardFor === snippet.id) return; // already shown/pending for this item
  clearTimeout(hoverShowTimer);
  hoverShowTimer = setTimeout(() => showHoverCard(snippet, itemEl), 350);
}

function showHoverCard(snippet, itemEl) {
  hoverCardFor = snippet.id;
  renderTokens(hoverCardEl, snippet.text);
  hoverCardEl.classList.add('visible');
  hoverCardEl.scrollTop = 0;
  // Prefer below the item; flip above if it would overflow the window
  const rect = itemEl.getBoundingClientRect();
  const cardH = Math.min(hoverCardEl.scrollHeight, 220);
  const below = rect.bottom + 6;
  const top = below + cardH <= window.innerHeight - 8 ? below : Math.max(8, rect.top - cardH - 6);
  hoverCardEl.style.top = `${top}px`;
}

function hideHoverCard() {
  clearTimeout(hoverShowTimer);
  clearTimeout(hoverHideTimer);
  hoverCardFor = null;
  hoverCardEl.classList.remove('visible');
}

function scheduleHoverHide() {
  clearTimeout(hoverHideTimer);
  hoverHideTimer = setTimeout(hideHoverCard, 150);
}

// Keep the card open while the mouse is on it (so it can be scrolled)
hoverCardEl.addEventListener('mouseenter', () => clearTimeout(hoverHideTimer));
hoverCardEl.addEventListener('mouseleave', scheduleHoverHide);
listEl.addEventListener('scroll', hideHoverCard);

function pick(snippet, paste) {
  hideHoverCard();
  const fields = customFields(snippet.text);
  if (fields.length) {
    openForm(snippet, fields, paste);
    return;
  }
  // Brief flash on the chosen item so the action feels acknowledged
  const idx = filtered.indexOf(snippet);
  const el = listEl.children[idx];
  if (el) el.classList.add('picked');
  setTimeout(() => send(snippet, expandBuiltins(snippet.text), paste), 90);
}

async function send(snippet, text, paste) {
  await invoke('paste_snippet', { text, paste, id: snippet.id });
}

function openForm(snippet, fields, paste) {
  formSnippet = snippet;
  formPasteMode = paste;
  formTitleEl.textContent = snippet.title;
  formFieldsEl.innerHTML = '';
  fields.forEach(f => {
    const label = document.createElement('label');
    label.textContent = f.replace(/_/g, ' ');
    const ta = document.createElement('textarea');
    ta.dataset.field = f;
    ta.rows = 1;
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitForm();
      }
    });
    formFieldsEl.append(label, ta);
  });
  document.body.classList.add('form-mode');
  formEl.classList.add('visible');
  formFieldsEl.querySelector('textarea').focus();
}

function closeForm() {
  formSnippet = null;
  document.body.classList.remove('form-mode');
  formEl.classList.remove('visible');
  searchEl.focus();
}

function submitForm() {
  if (!formSnippet) return;
  let text = formSnippet.text;
  formFieldsEl.querySelectorAll('textarea').forEach(ta => {
    text = text.replaceAll(`{${ta.dataset.field}}`, ta.value);
  });
  const s = formSnippet;
  const paste = formPasteMode;
  closeForm();
  send(s, expandBuiltins(text), paste);
}

formPasteEl.addEventListener('click', submitForm);
searchEl.addEventListener('input', filter);

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (formSnippet) closeForm();
    else invoke('hide_popup');
    return;
  }
  if (formSnippet) return; // form handles its own keys
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') hideHoverCard();
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (filtered.length) { selected = (selected + 1) % filtered.length; render(); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (filtered.length) { selected = (selected - 1 + filtered.length) % filtered.length; render(); }
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (filtered[selected]) pick(filtered[selected], !e.ctrlKey);
  }
});

async function reload() {
  closeForm();
  hideHoverCard();
  [snippets, clipboardNow] = await Promise.all([
    invoke('get_snippets'),
    invoke('get_clipboard_text'),
  ]);
  searchEl.value = '';
  filter();
  searchEl.focus();
}

listen('popup-shown', reload);
reload();
</script>
</body>
</html>
