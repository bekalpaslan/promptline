<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Promptline</title>
<style>
  :root {
    /* Theme: Sand (warm, Gray sand scale) — default. TOKENS v4, keep in sync with index.html */
    --bg-0: #131211;
    --bg-1: #201f1d;
    --bg-2: #2b2927;
    --bg-3: #383633;
    --bg-4: #46433f;
    --line: #2b2927;
    --text-1: #e4e3e2;
    --text-2: #9e9b94;
    --text-3: #7d7a72;
    --accent: #645bc5;
    --accent-hover: #7466d4;
    --accent-ring: rgba(100, 91, 197, .15);
    --accent-soft: rgba(100, 91, 197, .08);
    --accent-text: #b3aee0;
    --danger: #e5726f;
    --warn: #e8b45f;
    --param-builtin: #7fc6c9;
    --param-builtin-soft: rgba(127, 198, 201, .15);
    --param-field: #e8b45f;
    --param-field-soft: rgba(232, 180, 95, .15);
    --param-config: #d67ad0;
    --param-config-soft: rgba(214, 122, 208, .15);
    /* type scale */
    --fs-pill: 10px;
    --fs-caption: 11.5px;
    --fs-ui: 12.5px;
    --fs-body: 14px;
    --fs-title: 16px;
    /* radii */
    --r-sm: 6px;
    --r-md: 8px;
    --r-lg: 12px;
  }
  :root[data-theme="sundown"] {
    /* Theme: Sundown (cool, semantic colour system) */
    --bg-0: #0d0e11;
    --bg-1: #15171a;
    --bg-2: #1e2126;
    --bg-3: #282c33;
    --bg-4: #363c45;
    --line: #2d3136;
    --text-1: #e9ebee;
    --text-2: #aab1bd;
    --text-3: #828a97;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background: linear-gradient(180deg, var(--bg-1) 0%, var(--bg-0) 100%);
    color: var(--text-1);
    display: flex;
    flex-direction: column;
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    font-size: var(--fs-body);
  }
  button:focus-visible, [tabindex]:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; pointer-events: none; }

  #search {
    margin: 12px 12px 8px;
    padding: 8px 12px;
    font-size: var(--fs-body);
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--r-md);
    color: var(--text-1);
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  #search::placeholder { color: var(--text-3); }
  #search:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  #list {
    flex: 1;
    overflow-y: auto;
    padding: 0 8px 8px;
  }
  .item {
    position: relative;
    padding: 8px 12px;
    border-radius: var(--r-sm);
    cursor: pointer;
    user-select: none;
    transition: background .08s;
  }
  body.compact .item { padding: 6px 12px; }
  body.compact .item .preview { display: none; }
  .item::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 8px;
    bottom: 8px;
    width: 3px;
    border-radius: 2px;
    background: var(--cat, transparent);
    opacity: 0;
    transition: opacity .1s;
  }
  .item.selected::before { opacity: 1; }
  .item .row {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 0;
  }
  .item .title {
    font-size: var(--fs-body);
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    display: flex;
    align-items: center;
    gap: 5px;
    min-width: 0;
  }
  .item .title .t {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hl { color: var(--accent-text); }
  .pinicon { flex-shrink: 0; width: 12px; height: 12px; color: var(--warn); }
  .cat {
    font-size: var(--fs-pill);
    font-weight: 500;
    padding: 2px 8px;
    border-radius: 999px;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: pointer;
  }
  .ord {
    font-size: var(--fs-pill);
    color: var(--text-3);
    border: 1px solid var(--bg-3);
    border-radius: 4px;
    padding: 0 4px;
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
  }
  .item .preview {
    font-size: var(--fs-ui);
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  .item.selected { background: var(--bg-3); }
  .item.selected .preview { color: var(--text-2); }
  .item.picked { background: rgba(100, 91, 197, .35); }
  #empty {
    padding: 24px 20px;
    text-align: center;
    color: var(--text-3);
    font-size: var(--fs-ui);
  }
  #hint {
    padding: 8px 16px;
    font-size: var(--fs-caption);
    color: var(--text-3);
    border-top: 1px solid var(--line);
    background: var(--bg-1);
    border-radius: 0 0 var(--r-lg) var(--r-lg);
  }
  #hint b { color: var(--text-2); font-weight: 600; }
  #clipPreview {
    display: none;
    padding: 6px 16px;
    font-size: var(--fs-caption);
    color: var(--accent-text);
    background: var(--accent-soft);
    border-top: 1px solid var(--line);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #clipPreview.visible { display: block; }
  #clipPreview .label { color: var(--text-3); }

  /* Fill-in form for {field} placeholders */
  #form {
    flex: 1;
    display: none;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
    overflow-y: auto;
  }
  #form.visible { display: flex; }
  body.form-mode #search, body.form-mode #list { display: none; }
  #formTitle {
    font-size: var(--fs-body);
    font-weight: 600;
    color: var(--text-1);
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }
  #form label {
    font-size: var(--fs-caption);
    font-weight: 600;
    text-transform: capitalize;
    color: var(--text-2);
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 4px;
  }
  .luChip {
    font-size: var(--fs-pill);
    font-weight: 500;
    text-transform: none;
    color: var(--text-3);
    border: 1px solid var(--bg-3);
    border-radius: 999px;
    padding: 0 6px;
  }
  #form textarea {
    width: 100%;
    background: var(--bg-2);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    color: var(--text-1);
    padding: 8px 12px;
    font-size: var(--fs-body);
    font-family: inherit;
    outline: none;
    resize: none;
    min-height: 36px;
    transition: border-color .12s, box-shadow .12s;
  }
  #form textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-ring);
  }
  #formPaste {
    padding: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    border: none;
    border-radius: var(--r-sm);
    cursor: pointer;
    font-size: var(--fs-body);
  }
  #formPaste:hover { background: var(--accent-hover); }

  /* Hover/keyboard preview card: full prompt text, fixed max size, scrollable */
  #hoverCard {
    display: none;
    position: fixed;
    z-index: 10;
    left: 24px;
    right: 24px;
    max-height: 220px;
    overflow-y: auto;
    background: var(--bg-2);
    border: 1px solid var(--bg-4);
    border-radius: var(--r-md);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
    padding: 8px 12px;
    font-size: var(--fs-ui);
    line-height: 1.5;
    color: var(--text-2);
    white-space: pre-wrap;
    word-break: break-word;
  }
  #hoverCard.visible { display: block; }
  .tok {
    padding: 0 5px;
    border-radius: var(--r-sm);
    font-size: var(--fs-caption);
    font-weight: 600;
  }
  .tok.builtin { background: var(--param-builtin-soft); color: var(--param-builtin); }
  .tok.field { background: var(--param-field-soft); color: var(--param-field); }
  .tok.config { background: var(--param-config-soft); color: var(--param-config); }
  .tok.bad { background: rgba(229, 114, 111, .15); color: var(--danger); }

  /* Action panel (Tab on a selected prompt) */
  #actions {
    display: none;
    position: fixed;
    z-index: 20;
    left: 16px;
    right: 16px;
    bottom: 44px;
    background: var(--bg-2);
    border: 1px solid var(--bg-4);
    border-radius: var(--r-md);
    box-shadow: 0 8px 28px rgba(0, 0, 0, .55);
    padding: 6px;
  }
  #actions.visible { display: block; }
  #actionsTitle {
    font-size: var(--fs-caption);
    color: var(--text-3);
    padding: 4px 10px 6px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .act {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 10px;
    border-radius: var(--r-sm);
    font-size: var(--fs-ui);
    cursor: pointer;
    user-select: none;
    color: var(--text-1);
  }
  .act.selected { background: var(--bg-3); }
  .act.danger { color: var(--danger); }
  .act kbd {
    font-family: inherit;
    font-size: var(--fs-pill);
    color: var(--text-3);
    border: 1px solid var(--bg-3);
    border-radius: 4px;
    padding: 0 5px;
  }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--bg-3); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--bg-4); }
</style>
</head>
<body>
  <input id="search" type="text" placeholder="Search…  (#tag, @pack)" spellcheck="false" autocomplete="off" />
  <div id="list"></div>
  <div id="form">
    <div id="formTitle"></div>
    <div id="formFields"></div>
    <button id="formPaste">Paste</button>
  </div>
  <div id="hoverCard"></div>
  <div id="actions">
    <div id="actionsTitle"></div>
    <div id="actionsList"></div>
  </div>
  <div id="clipPreview"><span class="label">clipboard → </span><span id="clipText"></span></div>
  <div id="hint"></div>

<script src="core.js"></script>
<script>
const { invoke } = window.__TAURI__.core;
const { listen } = window.__TAURI__.event;
const C = window.PromptlineCore;

const searchEl = document.getElementById('search');
const listEl = document.getElementById('list');
const formEl = document.getElementById('form');
const formTitleEl = document.getElementById('formTitle');
const formFieldsEl = document.getElementById('formFields');
const formPasteEl = document.getElementById('formPaste');
const clipPreviewEl = document.getElementById('clipPreview');
const clipTextEl = document.getElementById('clipText');
const hoverCardEl = document.getElementById('hoverCard');
const hintEl = document.getElementById('hint');
const actionsEl = document.getElementById('actions');
const actionsTitleEl = document.getElementById('actionsTitle');
const actionsListEl = document.getElementById('actionsList');

const PIN_SVG = '<svg class="pinicon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17v5"/><path d="M9 10.8V6a3 3 0 1 1 6 0v4.8l2.6 2.6a1 1 0 0 1-.7 1.7H7.1a1 1 0 0 1-.7-1.7z"/></svg>';
const MAX_PINS = 5;

// Preferences set by the manager (persisted in config, mirrored to localStorage)
function applyPrefs() {
  document.documentElement.dataset.theme = localStorage.getItem('theme') || 'sand';
  document.body.classList.toggle('compact', (localStorage.getItem('density') || 'comfortable') === 'compact');
}
applyPrefs();

let clipboardNow = '';
let snippets = [];
let filtered = [];      // [{s, indices}] — indices highlight the title match
let selected = 0;
let formSnippet = null;
let formTextBase = '';
let formPasteMode = true;

// Keyboard/mouse arbitration: ignore hover-selection during keyboard nav and
// when the list scrolls under a stationary cursor
let suppressHoverUntil = 0;
let lastMouseX = -1, lastMouseY = -1;

// The hint bar reflects the current mode's actual key bindings
function setHint(mode) {
  hintEl.innerHTML = {
    list: '<b>Enter</b> paste · <b>Ctrl+Enter</b> copy · <b>Tab</b> actions · <b>→</b> preview · <b>Ctrl+1-5</b> quick',
    form: '<b>Enter</b> paste · <b>Ctrl+Enter</b> copy only · <b>Shift+Enter</b> newline · <b>Esc</b> back',
    panel: '<b>Enter</b> run · <b>1-9</b> pick · <b>Esc</b> back',
  }[mode];
}
setHint('list');

function filter() {
  const q = C.parseQuery(searchEl.value);
  const pool = snippets.filter(s => C.matchesFilters(s, q));
  if (!q.text) {
    filtered = pool
      .sort((a, b) => (b.pinned - a.pinned) || (b.uses - a.uses) || a.title.localeCompare(b.title))
      .map(s => ({ s, indices: null }));
  } else {
    filtered = pool
      .map(s => {
        const title = C.fuzzyScore(q.text, s.title);
        if (title) return { s, score: title.score, indices: title.indices };
        const tag = C.fuzzyScore(q.text, (s.tags || []).join(' '));
        if (tag) return { s, score: 3000 + tag.score, indices: null };
        const body = C.fuzzyScore(q.text, s.text);
        if (body) return { s, score: 5000 + body.score, indices: null };
        return null;
      })
      .filter(Boolean)
      .sort((a, b) => (a.score - b.score) || (b.s.uses - a.s.uses));
  }
  selected = 0;
  render();
}

function titleNode(s, indices) {
  const wrap = document.createElement('div');
  wrap.className = 'title';
  if (s.pinned) wrap.insertAdjacentHTML('beforeend', PIN_SVG);
  const t = document.createElement('span');
  t.className = 't';
  if (indices && indices.length) {
    const set = new Set(indices);
    for (let i = 0; i < s.title.length; i++) {
      const span = document.createElement('span');
      if (set.has(i)) span.className = 'hl';
      span.textContent = s.title[i];
      t.appendChild(span);
    }
  } else {
    t.textContent = s.title;
  }
  wrap.appendChild(t);
  return wrap;
}

function render() {
  listEl.innerHTML = '';
  if (!filtered.length) {
    const d = document.createElement('div');
    d.id = 'empty';
    d.textContent = snippets.length
      ? 'No matches'
      : 'No prompts yet — left-click the Promptline tray icon to add some';
    listEl.appendChild(d);
    updateClipPreview();
    return;
  }
  filtered.forEach((entry, i) => {
    const { s, indices } = entry;
    const item = document.createElement('div');
    item.className = 'item' + (i === selected ? ' selected' : '');
    const tags = s.tags || [];
    item.style.setProperty('--cat', C.tagColor(tags[0] || ''));
    const row = document.createElement('div');
    row.className = 'row';
    row.appendChild(titleNode(s, indices));
    for (const tag of tags.slice(0, 2)) {
      const pill = document.createElement('span');
      pill.className = 'cat';
      pill.textContent = tag;
      const c = C.tagColor(tag);
      pill.style.color = c;
      pill.style.background = c + '2e';
      pill.style.border = `1px solid ${c}44`;
      pill.title = `Filter by #${tag}`;
      pill.addEventListener('click', e => {
        e.stopPropagation();
        searchEl.value = `#${tag} `;
        filter();
        searchEl.focus();
      });
      row.appendChild(pill);
    }
    if (i < 5) {
      const ord = document.createElement('span');
      ord.className = 'ord';
      ord.textContent = `^${i + 1}`;
      row.appendChild(ord);
    }
    const preview = document.createElement('div');
    preview.className = 'preview';
    preview.textContent = s.text.replace(/\s+/g, ' ');
    item.append(row, preview);
    item.addEventListener('click', e => pick(s, !e.ctrlKey));
    item.addEventListener('mousemove', e => {
      const moved = e.clientX !== lastMouseX || e.clientY !== lastMouseY;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
      if (!moved || Date.now() < suppressHoverUntil) return;
      if (selected !== i) { selected = i; updateSelection(); }
      scheduleHoverCard(s, item);
    });
    item.addEventListener('mouseleave', e => {
      // Leaving "into" the preview card must not hide it
      if (e.relatedTarget === hoverCardEl || hoverCardEl.contains(e.relatedTarget)) return;
      scheduleHoverHide();
    });
    listEl.appendChild(item);
  });
  const sel = listEl.children[selected];
  if (sel) sel.scrollIntoView({ block: 'nearest' });
  updateClipPreview();
}

// Selection moves swap classes instead of rebuilding the list
function updateSelection() {
  [...listEl.children].forEach((el, i) => el.classList.toggle('selected', i === selected));
  const sel = listEl.children[selected];
  if (sel) sel.scrollIntoView({ block: 'nearest' });
  updateClipPreview();
}

// Show what {clipboard} would insert whenever the selected prompt uses it
function updateClipPreview() {
  const entry = filtered[selected];
  if (entry && entry.s.text.includes('{clipboard}')) {
    clipTextEl.textContent = clipboardNow.trim()
      ? clipboardNow.replace(/\s+/g, ' ').slice(0, 300)
      : '(clipboard is empty)';
    clipPreviewEl.classList.add('visible');
  } else {
    clipPreviewEl.classList.remove('visible');
  }
}

// --- Preview card (hover or Right-arrow) -----------------------------------
let hoverShowTimer = null;
let hoverHideTimer = null;
let hoverCardFor = null;

function renderTokens(target, text) {
  target.innerHTML = '';
  for (const part of C.tokenize(text)) {
    if (part.type === 'text') {
      target.appendChild(document.createTextNode(part.value));
      continue;
    }
    const tok = document.createElement('span');
    tok.className = 'tok ' + (part.type === 'bad' ? 'bad' : part.type);
    tok.textContent =
      part.type === 'builtin' ? part.name :
      part.type === 'field' ? `${part.name} — fill-in` :
      part.type === 'config' ? `${part.name} — config` :
      `${part.name} — invalid`;
    target.appendChild(tok);
  }
}

function showCardFor(index) {
  const entry = filtered[index];
  const itemEl = listEl.children[index];
  if (!entry || !itemEl) return;
  hoverCardFor = entry.s.id;
  renderTokens(hoverCardEl, entry.s.text);
  hoverCardEl.classList.add('visible');
  hoverCardEl.scrollTop = 0;
  const rect = itemEl.getBoundingClientRect();
  const cardH = Math.min(hoverCardEl.scrollHeight, 220);
  const below = rect.bottom + 6;
  const above = Math.max(8, rect.top - cardH - 6);
  let top = below + cardH <= window.innerHeight - 8 ? below : above;
  // Never park the card under the (possibly stationary) cursor: the row fires
  // mouseleave into the card, but a stationary cursor gets no mouseenter on
  // the card, so the pending hide would kill it right after it appears.
  const cursorIn = t => lastMouseY >= t - 2 && lastMouseY <= t + cardH + 2;
  if (cursorIn(top)) {
    const alt = top === below ? above : below;
    if (!cursorIn(alt) && alt >= 8 && alt + cardH <= window.innerHeight - 8) top = alt;
  }
  hoverCardEl.style.top = `${top}px`;
  // If it still overlaps the cursor (tiny windows), don't let a stale hide fire
  if (cursorIn(top)) clearTimeout(hoverHideTimer);
}

function scheduleHoverCard(snippet, itemEl) {
  clearTimeout(hoverHideTimer);
  if (hoverCardFor === snippet.id) return;
  clearTimeout(hoverShowTimer);
  hoverShowTimer = setTimeout(() => showCardFor([...listEl.children].indexOf(itemEl)), 350);
}

function hideHoverCard() {
  clearTimeout(hoverShowTimer);
  clearTimeout(hoverHideTimer);
  hoverCardFor = null;
  hoverCardEl.classList.remove('visible');
}

function scheduleHoverHide() {
  clearTimeout(hoverHideTimer);
  hoverHideTimer = setTimeout(hideHoverCard, 150);
}
hoverCardEl.addEventListener('mouseenter', () => clearTimeout(hoverHideTimer));
hoverCardEl.addEventListener('mouseleave', scheduleHoverHide);
listEl.addEventListener('scroll', hideHoverCard);

// --- Paste flow --------------------------------------------------------------
function pick(snippet, paste) {
  hideHoverCard();
  closePanel();
  let base = C.expandConfig(snippet.text, snippet.configValues);
  // Unset config params become fill-in fields instead of pasting holes
  base = C.downgradeUnsetConfig(base);
  const fields = C.customFields(base);
  if (fields.length) {
    openForm(snippet, base, fields, paste);
    return;
  }
  const idx = filtered.findIndex(e => e.s === snippet);
  const el = listEl.children[idx];
  if (el) el.classList.add('picked');
  setTimeout(() => send(snippet, C.expandBuiltins(base), paste), 90);
}

async function send(snippet, text, paste) {
  await invoke('paste_snippet', { text, paste, id: snippet.id });
}

function openForm(snippet, baseText, fields, paste) {
  formSnippet = snippet;
  formTextBase = baseText;
  formPasteMode = paste;
  formTitleEl.textContent = snippet.title;
  formFieldsEl.innerHTML = '';
  fields.forEach(f => {
    const label = document.createElement('label');
    label.textContent = f.replace(/_/g, ' ');
    const ta = document.createElement('textarea');
    ta.dataset.field = f;
    ta.rows = 1;
    const remembered = (snippet.fieldValues || {})[f];
    if (remembered) {
      ta.value = remembered;
      ta.rows = Math.min(4, remembered.split('\n').length);
      ta.addEventListener('focus', () => ta.select(), { once: true });
      const chip = document.createElement('span');
      chip.className = 'luChip';
      chip.textContent = 'last used';
      label.appendChild(chip);
    }
    ta.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        submitForm(e.ctrlKey);
      }
    });
    formFieldsEl.append(label, ta);
  });
  document.body.classList.add('form-mode');
  formEl.classList.add('visible');
  setHint('form');
  formFieldsEl.querySelector('textarea').focus();
}

function closeForm() {
  formSnippet = null;
  document.body.classList.remove('form-mode');
  formEl.classList.remove('visible');
  setHint('list');
  searchEl.focus();
}

function submitForm(forceCopy = false) {
  if (!formSnippet) return;
  let text = formTextBase;
  const values = {};
  formFieldsEl.querySelectorAll('textarea').forEach(ta => {
    values[ta.dataset.field] = ta.value;
    text = text.replaceAll(`{${ta.dataset.field}}`, ta.value);
  });
  const s = formSnippet;
  const paste = forceCopy ? false : formPasteMode;
  closeForm();
  // Remember entered values so next time the form is pre-filled.
  // Sequenced: paste_snippet re-reads the file to bump the use count.
  s.fieldValues = values;
  invoke('save_snippets', { snippets }).then(() => send(s, C.expandBuiltins(text), paste));
}
formPasteEl.addEventListener('click', e => submitForm(e.ctrlKey));

// --- Action panel (Tab) -------------------------------------------------------
let panelActions = [];
let panelSel = 0;
let panelOpen = false;

function panelItems(s) {
  return [
    { label: 'Paste', run: () => pick(s, true) },
    { label: 'Copy only', run: () => pick(s, false) },
    {
      label: s.pinned ? 'Unpin' : 'Pin',
      run: async () => {
        if (!s.pinned && snippets.filter(x => x.pinned).length >= MAX_PINS) {
          actionsTitleEl.textContent = `Max ${MAX_PINS} pins — unpin something first`;
          return;
        }
        s.pinned = !s.pinned;
        await invoke('save_snippets', { snippets });
        closePanel();
        filter();
      },
    },
    {
      label: 'Edit in manager',
      run: () => invoke('edit_in_manager', { id: s.id }),
    },
    {
      label: 'Delete', danger: true, arm: true,
      run: async function () {
        if (!this.armed) {
          this.armed = true;
          renderPanel();
          return;
        }
        snippets = snippets.filter(x => x.id !== s.id);
        await invoke('save_snippets', { snippets });
        closePanel();
        filter();
      },
    },
  ];
}

function renderPanel() {
  actionsListEl.innerHTML = '';
  panelActions.forEach((a, i) => {
    const row = document.createElement('div');
    row.className = 'act' + (i === panelSel ? ' selected' : '') + (a.danger ? ' danger' : '');
    const label = document.createElement('span');
    label.textContent = a.arm && a.armed ? 'Confirm delete?' : a.label;
    const kbd = document.createElement('kbd');
    kbd.textContent = String(i + 1);
    row.append(label, kbd);
    row.addEventListener('click', () => a.run());
    row.addEventListener('mousemove', () => {
      if (panelSel !== i) { panelSel = i; renderPanel(); }
    });
    actionsListEl.appendChild(row);
  });
}

function openPanel() {
  const entry = filtered[selected];
  if (!entry) return;
  hideHoverCard();
  panelActions = panelItems(entry.s);
  panelSel = 0;
  panelOpen = true;
  actionsTitleEl.textContent = entry.s.title;
  renderPanel();
  actionsEl.classList.add('visible');
  setHint('panel');
}

function closePanel() {
  if (!panelOpen) return;
  panelOpen = false;
  actionsEl.classList.remove('visible');
  setHint('list');
}

// --- Keyboard ------------------------------------------------------------------
searchEl.addEventListener('input', filter);

document.addEventListener('keydown', e => {
  if (panelOpen) {
    if (e.key === 'Escape') { e.preventDefault(); closePanel(); }
    else if (e.key === 'ArrowDown') { e.preventDefault(); panelSel = (panelSel + 1) % panelActions.length; renderPanel(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); panelSel = (panelSel - 1 + panelActions.length) % panelActions.length; renderPanel(); }
    else if (e.key === 'Enter') { e.preventDefault(); panelActions[panelSel].run(); }
    else if (/^[1-9]$/.test(e.key)) {
      e.preventDefault();
      const a = panelActions[Number(e.key) - 1];
      if (a) a.run();
    } else if (e.key === 'Tab') { e.preventDefault(); closePanel(); }
    return;
  }
  if (e.key === 'Escape') {
    if (formSnippet) closeForm();
    else invoke('hide_popup');
    return;
  }
  if (formSnippet) return; // form handles its own keys
  if (e.ctrlKey && /^[1-5]$/.test(e.key)) {
    e.preventDefault();
    const entry = filtered[Number(e.key) - 1];
    if (entry) pick(entry.s, true);
    return;
  }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    hideHoverCard();
    suppressHoverUntil = Date.now() + 250;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (filtered.length) { selected = (selected + 1) % filtered.length; updateSelection(); }
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (filtered.length) { selected = (selected - 1 + filtered.length) % filtered.length; updateSelection(); }
  } else if (e.key === 'ArrowRight' && searchEl.selectionStart === searchEl.value.length) {
    // At the end of the query, Right shows the full-prompt preview card
    if (filtered.length) { e.preventDefault(); showCardFor(selected); }
  } else if (e.key === 'ArrowLeft' && hoverCardFor) {
    e.preventDefault();
    hideHoverCard();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    openPanel();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (filtered[selected]) pick(filtered[selected].s, !e.ctrlKey);
  }
});

async function reload() {
  applyPrefs();
  closePanel();
  closeForm();
  hideHoverCard();
  [snippets, clipboardNow] = await Promise.all([
    invoke('get_snippets'),
    invoke('get_clipboard_text'),
  ]);
  searchEl.value = '';
  filter();
  searchEl.focus();
}

listen('popup-shown', reload);
reload();
</script>
</body>
</html>
